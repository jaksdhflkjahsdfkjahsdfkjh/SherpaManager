name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package, without the leading v (for example 0.4.4). Manual runs package only; they do not create a GitHub release.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Package x64 release
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:INPUT_VERSION.Trim()
          } else {
            $version = $env:REF_NAME -replace '^v', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Version '$version' is not in the expected N.N.N or N.N.N.N form."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Packaging version $version"

      - name: Verify project version matches
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = & ./scripts/Test-ReleaseMetadata.ps1 -ExpectedVersion $env:EXPECTED_VERSION
          Write-Host "Version fields and release notes verified for $($metadata.Version)."

      - name: Restore
        run: dotnet restore SherpaManager.sln

      - name: Build
        run: dotnet build SherpaManager.sln --configuration Release --no-restore

      - name: Test
        run: dotnet run --project tests/SherpaManager.Tests/SherpaManager.Tests.csproj --configuration Release --no-build

      - name: Publish framework-dependent build
        run: >
          dotnet publish src/SherpaManager.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output build/publish/framework-dependent

      - name: Publish self-contained build
        run: >
          dotnet publish src/SherpaManager.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output build/publish/self-contained

      # One file, no unzipping and no installed .NET runtime. Safe for this app
      # because it resolves its own location through Environment.ProcessPath
      # rather than Assembly.Location, which single-file publishing breaks.
      - name: Publish portable single-file build
        run: >
          dotnet publish src/SherpaManager.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          --output build/publish/portable

      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: ./scripts/Install-InnoCompiler.ps1 -ToolsDirectory build/tools

      - name: Verify packages and create release artifacts
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/New-ReleaseArtifacts.ps1 -PublishRoot build/publish -OutputDirectory build/artifacts -CompilerPath build/tools/InnoSetup/ISCC.exe -ExpectedVersion $env:VERSION

      - name: Verify installer upgrade and uninstall
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $previous = 'build/tools/SherpaManager-v0.7.2-win-x64-setup.exe'
          Invoke-WebRequest -Uri 'https://github.com/jaksdhflkjahsdfkjahsdfkjh/SherpaManager/releases/download/v0.7.2/SherpaManager-v0.7.2-win-x64-setup.exe' -OutFile $previous
          if ((Get-FileHash -LiteralPath $previous -Algorithm SHA256).Hash.ToLowerInvariant() -ne '685fc4625036130a1a2c88804c6e26802543227091f8fdb7d2feef58290d1290') {
            throw 'Previous installer download does not match its published SHA-256.'
          }
          ./scripts/Test-InstallerLifecycle.ps1 -Installer "build/artifacts/SherpaManager-v$env:VERSION-win-x64-setup.exe" -PreviousInstaller $previous -ExpectedVersion $env:VERSION |
            Tee-Object -FilePath build/artifacts/INSTALLER_TEST_RESULTS.txt

      - name: Extract release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:VERSION
          $metadata = & ./scripts/Test-ReleaseMetadata.ps1 -ExpectedVersion $version
          $body = $metadata.Notes

          $verify = @(
            ''
            ''
            '## Verifying a download'
            ''
            'Compare the SHA-256 of the downloaded archive against `SHA256SUMS.txt`:'
            ''
            '```powershell'
            "Get-FileHash .\SherpaManager-v$version-win-x64-setup.exe -Algorithm SHA256"
            '```'
          ) -join "`n"

          Set-Content -Path 'build/artifacts/RELEASE_NOTES.md' -Value ($body + $verify) -Encoding utf8
          Get-Content 'build/artifacts/RELEASE_NOTES.md' | Write-Host

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SherpaManager-v${{ steps.version.outputs.version }}-win-x64
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 30

      # Drafted rather than published, so the archives can be checked on real
      # hardware before anyone can download them. Publish from the Releases page.
      - name: Draft GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          $arguments = @(
            'release', 'create', $env:TAG,
            '--draft',
            '--title', "Sherpa Manager v$($env:VERSION)",
            '--notes-file', 'build/artifacts/RELEASE_NOTES.md'
          )
          # Stable release; review the draft before publishing.
          $arguments += Get-ChildItem build/artifacts -File |
            Where-Object { $_.Extension -in '.exe', '.zip' -or $_.Name -in 'SHA256SUMS.txt', 'QUICKSTART.md' } |
            ForEach-Object { $_.FullName }

          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE." }
