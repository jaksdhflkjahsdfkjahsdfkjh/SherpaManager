name: Bug report
description: Report a reproducible problem in Sherpa Manager
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. Do not include passwords, tokens, or private paths you do not want to share publicly.
  - type: input
    id: version
    attributes:
      label: Sherpa Manager version
      description: Shown by Settings -> Copy diagnostics, which also reports your Windows, GPU, and driver versions.
      placeholder: 0.4.4
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Display and GPU setup
      description: Include monitor count, GPU model, and connection arrangement when relevant.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a profile...
        2. Capture the layout...
        3. Activate the profile...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
